<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>دعوة زفاف آية ومحمد</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #6C3D37; 
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
        }
        .invitation-container {
            width: 100%;
            height: 100vh;
            /* الكود السحري لجعل الصورة خلفية طبيعية تملأ كامل أبعاد الشاشة بدون حواف */
            background-image: url('aya_mohamed.jpg');
            background-position: center center;
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
            display: flex;
            justify-content: center;
        }
        .button-wrapper {
            position: absolute;
            bottom: 50px; /* تثبيت زر الموقع بشكل عائم واحترافي أسفل الشاشة */
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .location-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #441E19; 
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s, background-color 0.2s;
        }
        .location-btn:active {
            transform: scale(0.98);
            background-color: #331410;
        }
        .location-btn-icon {
            margin-left: 8px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="invitation-container">
        <!-- زر الخريطة التفاعلي الموجه لقاعة دار الإشارة -->
        <div class="button-wrapper">
            <a href="https://maps.app.goo.gl/1iohsYie6QYmyzVZ6?g_st=ic" target="_blank" class="location-btn">
                TAP TO GET THE LOCATION <span class="location-btn-icon">📍</span>
            </a>
        </div>
    </div>

</body>
</html>
