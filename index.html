<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aya & Mohamed | Wedding Invitation</title>
    <!-- الأكواد الخاصة بالرابط وصورته عند المشاركة على واتساب -->
    <meta property="og:title" content="Aya & Mohamed | Wedding Invitation">
    <meta property="og:description" content="Celebrate Aya & Mohamed – Friday, January 21, 2027 at 7:00 PM">
    <meta property="og:url" content="https://github.io">
    <meta property="og:image" content="https://github.ioaya_mohamed.jpg">
    <meta property="og:secure_url" content="https://github.ioaya_mohamed.jpg">
    <meta property="og:type" content="website">

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f5f2eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        /* حاوية العرض الرئيسية */
        .stage {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 420px; /* تحديد الارتفاع لمنع تسريب الكارت للأسفل */
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
        }

        /* ✉️ مجسم الظرف متموضع في السنتر */
        .envelope {
            position: absolute;
            width: 350px;
            height: 230px;
            background-color: #3d1715;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            z-index: 10;
            top: 50%;
            transform: translateY(-50%);
        }

        /* جيب الظرف الأمامي المطور لتغطية الورقة كلياً */
        .envelope-front {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 175px solid #4a1e1b;
            border-right: 175px solid #4a1e1b;
            border-bottom: 115px solid #451b18;
            border-top: 115px solid transparent;
            z-index: 30; /* فوق الكارت لمنع ظهوره بالخارج */
            pointer-events: none;
        }

        /* غطاء الظرف العلوي */
        .envelope-flap {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 175px solid transparent;
            border-right: 175px solid transparent;
            border-top: 125px solid #4a1e1b;
            top: 50%;
            transform: translateY(-115px);
            transform-origin: top;
            transition: transform 0.6s ease;
            z-index: 40; /* يغلق بالكامل فوق الجيب والكارت */
            cursor: pointer;
            left: calc(50% - 175px);
        }

        /* 🟡 الختم الشمعي الدائري لفتح الظرف */
        .seal-button {
            position: absolute;
            top: -20px;
            left: -45px;
            background: radial-gradient(circle, #f3e092 0%, #d4af37 100%);
            color: #4a1e1b;
            border: 2px solid #b89326;
            width: 90px;
            height: 90px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            line-height: 1.3;
            z-index: 50;
            animation: pulse 2s infinite;
            transition: opacity 0.3s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(212, 175, 55, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        /* 📜 الورقة مخفية ومقلصة تماماً بداخل المظروف */
        .letter {
            position: absolute;
            width: 320px;
            height: 460px;
            background-color: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            z-index: 5; /* خلف الغطاء والجيب الأمامي فلا تظهر أبداً */
            top: 50%;
            left: calc(50% - 160px);
            transform: translateY(-50%) scale(0.1); /* مقلصة ومخفية تماماً بالداخل */
            opacity: 0;
            transition: transform 1s cubic-bezier(0.25, 1, 0.5, 1), z-index 0.5s ease, opacity 0.5s ease;
            border-radius: 8px;
            overflow: hidden;
        }

        /* الصورة بداخل كارت الدعوة */
        .letter img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* زر الموقع في أسفل الكارت */
        .location-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #4a1e1b;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 8px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            white-space: nowrap;
            z-index: 100;
        }

        /* 📜 حركة فتح الظرف الفعلي وصعود الكارت */
        .stage.open .envelope-flap {
            transform: translateY(-115px) rotateX(180deg);
            z-index: 1; /* يعود للخلف ليسمح للكارت بالخروج أمامه */
        }

        /* صعود وتمدد الكارت ليمر في منتصف الشاشة أمام الضيف */
        .stage.open .letter {
            transform: translateY(-50%) scale(1.1); /* صعود كامل للسنتر */
            opacity: 1;
            z-index: 100; /* في المقدمة فوق كل الأغطية والجوانب */
        }

        .stage.open .seal-button {
            opacity: 0;
            pointer-events: none;
        }

        /* النص العلوي */
        .hint-text {
            position: absolute;
            top: 5vh;
            color: #4a1e1b;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            transition: opacity 0.5s ease;
            z-index: 5;
        }
        .stage.open .hint-text {
            opacity: 0;
        }
    </style>
</head>
<body>

    <div class="hint-text">دعوة زفاف خاصة ✉️</div>

    <div id="weddingStage" class="stage">
        
        <!-- غطاء الظرف -->
        <div class="envelope-flap" id="flap">
            <button class="seal-button" onclick="openWeddingEnvelope()">اضغط<br>لفتح الدعوة</button>
        </div>
        
        <!-- بودي وجيب الظرف الرئيسي -->
        <div class="envelope">
            <div class="envelope-front"></div>
        </div>

        <!-- 📜 كارت الدعوة المخفي تماماً حتى حدوث الضغط -->
        <div class="letter" id="letter">
            <img src="aya_mohamed.jpg" alt="دعوة زفاف آية ومحمد">
            
            <!-- زر الخريطة بداخل الكارت -->
            <a href="https://goo.gl" class="location-btn">
                TAP TO GET THE LOCATION 📍
            </a>
        </div>
    </div>

    <!-- عنصر تشغيل الصوت المخفي -->
    <audio id="weddingAudio" loop preload="auto">
        <source src="wedding-music.mp3" type="audio/mpeg">
    </audio>

    <script>
        function openWeddingEnvelope() {
            const audio = document.getElementById('weddingAudio');
            const stage = document.getElementById('weddingStage');

            audio.play().catch(error => console.log(error));
            stage.classList.add('open');
        }
    </script>

</body>
</html>
