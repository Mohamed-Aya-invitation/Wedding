<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف آية ومحمد</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #C07A72; 
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .invitation-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
            position: relative;
        }
        .invitation-image {
            width: 100%;
            height: auto;
            max-width: 500px; /* يضمن عدم تمدد الصورة بشكل مشوه على الشاشات الكبيرة */
            display: block;
        }
        .button-wrapper {
            position: absolute;
            bottom: 30px; /* لتثبيت الزر في أسفل الشاشة فوق الصورة بشكل أنيق */
            width: 100%;
            text-align: center;
            z-index: 10;
        }
        .location-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #5C2A24;
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s, background-color 0.2s;
        }
        .location-btn:active {
            transform: scale(0.98);
            background-color: #441E19;
        }
        .location-btn-icon {
            margin-left: 8px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="invitation-container">
        <!-- 1. صورة الدعوة الجاهزة لتملأ الشاشة -->
        <img src="aya_mohamed.jpg" alt="Aya & Mohamed Wedding Invitation" class="invitation-image">
        
        <!-- 2. زر الخريطة التفاعلي مثبت بالأسفل -->
        <div class="button-wrapper">
            <a href="https://maps.app.goo.gl/1iohsYie6QYmyzVZ6?g_st=ic" target="_blank" class="location-btn">
                <span class="location-btn-icon">📍</span> TAP TO GET THE LOCATION
            </a>
        </div>
    </div>

</body>
</html>
