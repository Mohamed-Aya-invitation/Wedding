<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>دعوة زفاف آية ومحمد</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* تم تعديل الخلفية للون الروز الداكن الغامق المتناسق مع ظلال الصورة الأصلية */
            background-color: #6C3D37; 
            font-family: system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }
        .invitation-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }
        .invitation-image {
            width: 100%;
            height: auto;
            max-width: 500px; /* يحافظ على دقة وأبعاد الصورة الأصلية بدون أي تشويه */
            display: block;
        }
        .button-wrapper {
            padding: 30px 0;
            width: 100%;
            text-align: center;
            background-color: #6C3D37; /* يدمج منطقة الزر تماماً مع الخلفية الجديدة */
        }
        .location-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #441E19; /* لون داكن فخم جداً ومتناسق للزر */
            color: #FFFFFF;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .location-btn:active {
            transform: scale(0.98);
            background-color: #331410;
        }
        .location-btn-icon {
            margin-left: 8px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="invitation-container">
        <!-- 1. صورة الدعوة بأبعادها الأصلية الفخمة -->
        <img src="aya_mohamed.jpg" alt="Aya & Mohamed Wedding Invitation" class="invitation-image">
        
        <!-- 2. زر الخريطة التفاعلي المدمج في أرضية متناسقة -->
        <div class="button-wrapper">
            <a href="https://goo.gl" target="_blank" class="location-btn">
                TAP TO GET THE LOCATION <span class="location-btn-icon">📍</span>
            </a>
        </div>
    </div>

</body>
</html>
